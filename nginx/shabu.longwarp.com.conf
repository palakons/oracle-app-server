# Nginx configuration for shabu.longwarp.com (shabu_nub_nub)
# Handles HTTP to HTTPS redirect, Let's Encrypt SSL, and proxying to Node application on 127.0.0.1:3002.

server {
    listen 80;
    listen [::]:80;
    server_name shabu.longwarp.com;

    # Allow Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shabu.longwarp.com;

    # SSL Certificate configuration (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/shabu.longwarp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shabu.longwarp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy header settings
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Node.js Application (localhost:3002)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
