# Nginx configuration for trade.longwarp.com (alpha-trader-v2)
# Handles HTTP to HTTPS redirect, Let's Encrypt SSL, Basic Auth security, and proxying to Node frontend (3000) and Python backend (8000).

server {
    listen 80;
    listen [::]:80;
    server_name trade.longwarp.com;

    # Allow Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trade.longwarp.com;

    # Dedicated Logging for trade.longwarp.com
    access_log /var/log/nginx/trade.longwarp.com.access.log;
    error_log /var/log/nginx/trade.longwarp.com.error.log;

    # SSL Certificate configuration (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/toll.longwarp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toll.longwarp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy header settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Backend API requests (Python Backend on localhost:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Frontend web application (Node Frontend on localhost:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
